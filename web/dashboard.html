<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoVow — Dashboard</title>
  <link rel="stylesheet" href="/site.css?v=20260625" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">RepoVow</a>
    <nav>
      <a href="/">Home</a>
      <a href="/account">Account</a>
      <a href="/pricing">Pricing</a>
      <a href="/trust">Trust</a>
    </nav>
  </header>

  <main class="page-wide" id="content" style="display:none">
    <div class="dash-header">
      <div>
        <h1 id="title">Project</h1>
        <p class="dashboard-meta">Project <code id="pid">__PROJECT_ID__</code> · <span id="updated"></span></p>
      </div>
      <div class="dash-badges" id="badges"></div>
    </div>

    <div class="dash-actions">
      <a class="btn primary" href="/dashboard/__PROJECT_ID__/edit">Edit goal</a>
      <a class="btn secondary" href="/account">Fleet</a>
    </div>

    <div class="grid-2">
      <section class="card">
        <h2 class="card-title">Setup checklist</h2>
        <div id="onboarding"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Policy</h2>
        <div id="policy-detail" class="policy-box"></div>
      </section>
    </div>

    <section class="card">
      <h2 class="card-title">Connect your repo</h2>
      <pre id="connect-cmd" class="code-block"></pre>
      <div id="connect-copy"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2 class="card-title">Activity</h2>
        <div id="changelog"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Snapshot</h2>
        <div id="snapshot"></div>
      </section>
    </div>
  </main>

  <p id="loading" class="page-wide muted">Loading…</p>
  <p id="error" class="page-wide err" style="display:none"></p>

  <script src="/app.js"></script>
  <script>
    const projectId = "__PROJECT_ID__";
    const startUrl = "/start?link=" + encodeURIComponent(projectId);

    async function load() {
      const res = await fetch("/api/projects/" + projectId);
      if (res.status === 401 || res.status === 403) {
        location.replace(startUrl);
        return;
      }
      if (!res.ok) {
        document.getElementById("loading").style.display = "none";
        const err = document.getElementById("error");
        err.style.display = "block";
        err.textContent = "Could not load project (" + res.status + ").";
        return;
      }
      const data = await res.json();
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
      document.getElementById("title").textContent = data.name || "Project";
      document.getElementById("updated").textContent = "updated " + (data.updated_at || "never");
      document.getElementById("badges").innerHTML = RepoVowUI.policyBadge(data.policy || {});
      document.getElementById("onboarding").innerHTML = RepoVowUI.renderOnboarding(data);
      document.getElementById("policy-detail").innerHTML =
        `<p>${RepoVowUI.policyBadge(data.policy || {})}</p>` +
        `<p class="muted small">${RepoVowUI.escapeHtml((data.policy && data.policy.detail) || "Policy syncs when CLI pushes state.")}</p>`;
      document.getElementById("changelog").innerHTML = RepoVowUI.renderChangelog(data.changelog);
      document.getElementById("snapshot").innerHTML = RepoVowUI.renderSnapshotSections(data.snapshot);

      const base = location.origin;
      const cmd =
        "npm install -g repovow\n" +
        "repovow cloud link --url " + base + " --project " + projectId + " --key <project-access-key>\n" +
        'repovow onboard "your task" --accept "tests pass"';
      document.getElementById("connect-cmd").textContent = cmd;
      document.getElementById("connect-copy").innerHTML = RepoVowUI.copyButton(cmd, "Copy commands");
    }
    load();
  </script>
</body>
</html>
