name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: linux-arm64-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_pkg: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_pkg: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage npm platform package
        env:
          REPOVOW_TARGET: ${{ matrix.target }}
          REPOVOW_NPM_PKG: ${{ matrix.npm_pkg }}
          REPOVOW_VERSION: ${{ github.ref_name }}
        run: ./scripts/stage-npm.sh --target "${{ matrix.target }}" --npm-pkg "${{ matrix.npm_pkg }}"

      - name: Archive binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/repovow" "dist/repovow-${{ matrix.target }}"
          tar -czf "dist/repovow-${VERSION}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" repovow

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: |
            dist/
            npm/platforms/${{ matrix.npm_pkg }}/

  publish:
    name: Publish npm + GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64; do
            src="artifacts/${pkg}/npm/platforms/${pkg}"
            if [ -d "$src" ]; then
              mkdir -p "npm/platforms/${pkg}"
              cp -r "$src/"* "npm/platforms/${pkg}/"
            fi
          done
          node npm/repovow-cli/scripts/sync-version.js "$VERSION"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm whoami
          else
            echo "NPM_TOKEN is unset; npm trusted publishing must authorize this workflow"
          fi

          node npm/repovow-cli/scripts/prep-publish.js "$VERSION"

          publish_unless_present() {
            local directory="$1"
            local name
            name="$(node -p "require('./${directory}/package.json').name")"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} already published; skipping"
              return
            fi
            (cd "$directory" && npm publish --access public --provenance)
          }

          for pkg in npm/platforms/*/; do
            if [ -f "${pkg}bin/repovow" ]; then
              publish_unless_present "${pkg%/}"
            fi
          done
          publish_unless_present npm/repovow-cli

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/dist/*
          generate_release_notes: true
