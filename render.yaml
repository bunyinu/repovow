# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: repovow-cloud
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: REPOVOW_DB_PATH
        value: /data/repovow.db
      - key: RUST_LOG
        value: info
      - key: REPOVOW_FREE_PROJECT_LIMIT
        value: "1"
      - key: REPOVOW_PRO_PROJECT_LIMIT
        value: "50"
      - key: REPOVOW_STRIPE_PAYMENT_LINK
        sync: false
      - key: REPOVOW_UPGRADE_CODES
        sync: false
      - key: REPOVOW_CREATE_SECRET
        sync: false
      - key: REPOVOW_COOKIE_SECURE
        value: "true"
    disk:
      name: repovow-data
      mountPath: /data
      sizeGB: 1
